<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
<script defer src="main.js"></script></head>
<body>
    <!--Slideshow contiainer-->
    <div class="slideshow-container">

        <!--Full width images with number and caption text-->
        <div class="mySlides">
            <img src="0e0601576997e455ff72.jpg">
        </div>

        <div class="mySlides">
            <img src="eeaf651613524aefe07e.jpg">
        </div>

        <div class="mySlides">
            <img src="9221c041b6dae5fb9094.jpg">
        </div>

        <div class="mySlides">
            <img src="234791930481050bd40b.jpg">
        </div>

        <!--Next and previous buttons-->
        <a class="prev">&#10094;</a>
        <a class="next">&#10095;</a>
    </div>

    <!--The dots-->
    <div class="dots-container">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
    
</body>
</html>
